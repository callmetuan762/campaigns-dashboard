  # ---------------- SCREEN-ANXIOUS ----------------
  - {id: S-A1, segment: screen_anxious, template: A, title: "Built to never end",
     hook: "Most kid apps are built to never end… / This one falls asleep.",
     beats: [["0-2 s", "An autoplay countdown: 'Next episode in 5'."], ["2-7 s", "The pet yawns on the display; the kid tucks it in."], ["7-11 s", "The pet sleeps; the kid puts it down and walks off."], ["11-15 s", "Super: 'An ending built in.'"]],
     primary_text: "Nowa has a screen. It also has a bedtime."}
  - {id: S-A2, segment: screen_anxious, template: A, title: "Just another screen?",
     hook: "Is this just another screen? / The screen is the prompt. The play happens in the room.",
     beats: [["0-2 s", "Text over the device in a kid's hand."], ["2-7 s", "The pet needs help; the kid runs off to do the mission in the real world."], ["7-11 s", "Super: 'No feed. No autoplay. No open internet.'"], ["11-15 s", "End card: A pocket-sized pet, not a screen to scroll."]],
     primary_text: "It has a screen. Here's what your child does on it, and where play stops."}
  - {id: S-A3, segment: screen_anxious, template: A, title: "We built the ending first",
     hook: "The hardest part of screen time is the end… / So we built the ending first.",
     beats: [["0-3 s", "A tablet being handed back (hands only, no tears on camera)."], ["3-8 s", "The pet gets sleepy; the kid tucks it in."], ["8-12 s", "Super: 'Care, wait, grow. A loop that moves in days, not seconds.'"], ["12-15 s", "End card."]],
     primary_text: "I need the break the screen buys me. I just hate what it costs when it ends. (Every parent we talked to said a version of this.)"}
  - {id: S-B1, segment: screen_anxious, template: B, title: "He ends his own screen time now",
     hook: "My son ends his own screen time now. Because his pet gets sleepy.",
     beats: [["0-3 s", "Parent to camera, still a bit amazed."], ["3-10 s", "Facts: 'No feed. No autoplay. The pet grows over days, then it needs sleep.'"], ["10-14 s", "Turn: 'There's no next episode.'"], ["14-22 s", "Close: 'Handing it back used to be the worst part of my day.'"]],
     primary_text: "The first screen I don't have to fight to end."}
  - {id: S-B2, segment: screen_anxious, template: B, title: "The break the screen buys me",
     hook: "I need the break the screen buys me. I just hate what it costs.",
     beats: [["0-3 s", "Parent making dinner, to camera."], ["3-10 s", "Facts: 'It has a screen. It has no feed, no autoplay, no internet. And the pet goes to sleep.'"], ["10-14 s", "Turn: 'So the break has an ending.'"], ["14-22 s", "Close: kid at the table, pet asleep beside the plate."]],
     primary_text: "You still get the break. You just don't pay for it at the end."}
  - {id: S-B3, segment: screen_anxious, template: B, title: "The first screen I don't feel guilty about",
     hook: "Not to be dramatic, but this is the first screen I don't feel guilty about.",
     beats: [["0-3 s", "Mom holding the device up."], ["3-10 s", "Facts: 'It's the size of my palm. Three buttons. The pet sends him off to do things.'"], ["10-14 s", "Turn: 'Not a friend in a screen. A reason to look up from one.'"], ["14-22 s", "Close: the kid outside, device in pocket."]],
     primary_text: "No chat. No feed. No open internet. Just a small creature that needs your kid."}
