  # ---------------- BIG FEELINGS ----------------
  - {id: F-A1, segment: big_feelings, template: A, title: "Calm is a rep",
     hook: "Calm isn't a personality. / It's a rep.",
     beats: [["0-2 s", "Kinetic text over a calm afternoon."], ["2-6 s", "The pet sulks on the display."], ["6-11 s", "Kid does a calm-down mission to help it; the pet settles."], ["11-15 s", "Super: 'Small reps, in calm moments.'"]],
     primary_text: "Nobody learns calm mid-meltdown. Nowa lets your child practise it on a good day."}
  - {id: F-A2, segment: big_feelings, template: A, title: "Name it first",
     hook: "Most kids can't name the feeling… / until they've named it for someone smaller.",
     beats: [["0-2 s", "Text over a kid's face, unsure."], ["2-7 s", "The pet looks sulky; the mission asks what it's feeling."], ["7-12 s", "Kid picks the feeling; the pet brightens."], ["12-15 s", "Super: 'A feeling has to be named before a child can do anything with it.'"]],
     primary_text: "Know it. Show it. Bring it down. Practised with a pet your child looks after."}
  - {id: F-A3, segment: big_feelings, template: A, title: "The theory evaporates",
     hook: "You've read the books… / Your child never got the practice.",
     beats: [["0-2 s", "A stack of parenting books."], ["2-7 s", "Cut to the kid helping the pet through a calm mission."], ["7-12 s", "Super: 'Built with the scientists who wrote the science.'"], ["12-15 s", "End card: Calm is a rep, not a trait."]],
     primary_text: "The theory was only ever handed to you. Nowa gives your child a way to practise."}
  - {id: F-B1, segment: big_feelings, template: B, title: "Better at calming down than me",
     hook: "My son is now better at calming down than I am.",
     beats: [["0-3 s", "Parent to camera, a little sheepish."], ["3-10 s", "Facts: 'His pet has feelings. When it's upset, he helps it through a mission. He practises on good days.'"], ["10-14 s", "Turn: 'It never talks back. It chirps and sulks, that's it.'"], ["14-22 s", "Close (real family line only): the moment he used it himself."]],
     primary_text: "Calm is a rep, not a trait. He's been doing reps."}
  - {id: F-B2, segment: big_feelings, template: B, title: "She taught her pet a calm-down trick",
     hook: "She taught her pet a calm-down trick. Then she taught it to me.",
     beats: [["0-3 s", "Parent laughing at the camera."], ["3-10 s", "Facts: the pet gets upset, the mission is a calm-down practice, the pet settles."], ["10-14 s", "Turn: 'We practise when nobody's upset.'"], ["14-22 s", "Close: kid demonstrates the trick on the parent."]],
     primary_text: "Practice when calm, not in the storm."}
  - {id: F-B3, segment: big_feelings, template: B, title: "A pet with a better feelings vocabulary",
     hook: "Not to be dramatic, but a pixel pet has more feelings words than our whole family.",
     beats: [["0-3 s", "Dad at the dinner table."], ["3-10 s", "Facts: the pet chirps, sulks, celebrates; the kid names what it feels."], ["10-14 s", "Turn: 'It never says a word. The kids do.'"], ["14-22 s", "Close: 'Dinner now starts with how's the pet feeling.'"]],
     primary_text: "A pet, not an AI companion. It speaks in sound and feeling, never sentences."}
  - {id: F-C1, segment: big_feelings, template: C, title: "After school, but different",
     hook: "The after-school crash. Here's what changed.",
     beats: [["0-5 s", "Set-up: Nowa tucked in the backpack pocket."], ["5-12 s", "Kid home, heavy; the pet on the display is sulky too."], ["12-20 s", "Kid helps the pet settle; shoulders drop."], ["20-24 s", "Close: 'She holds it together at school. Now she has somewhere to let it out.'"]],
     primary_text: "The teacher sees a great kid. You get the crash. Nowa gives the feeling somewhere to go."}
  - {id: F-C2, segment: big_feelings, template: C, title: "Meeting the pet on a calm Sunday",
     hook: "We introduced the pet on a calm Sunday. On purpose.",
     beats: [["0-5 s", "Quiet living room; the device is revealed."], ["5-12 s", "She names the pet; it celebrates."], ["12-20 s", "First feelings mission, easy and playful."], ["20-24 s", "Close: 'Practice on a good day, so it's there on a hard one.'"]],
     primary_text: "Every part of calm can be practised, in small reps, in calm moments."}
  - {id: F-C3, segment: big_feelings, template: C, title: "Grandma meets the pet that never talks",
     hook: "Grandma's face when the pet didn't say a word.",
     beats: [["0-5 s", "Kid hands the device to grandma."], ["5-12 s", "Grandma: 'It doesn't talk?' Kid: 'It sulks. You have to guess.'"], ["12-20 s", "They name the feeling together; the pet brightens."], ["20-24 s", "Close on the two of them laughing."]],
     primary_text: "It doesn't talk back. That's the whole point."}
