# Editorial layer for `teardown video-report`. Humans own this file; the command owns the numbers.
# When the report marks a top-set ad "new since notes", add it under ad_notes.
# Copy here follows the nowa-content-writing skill (no em-dashes, no "screen-free" for Nowa,
# pet never speaks words, "built with" advisors, no urgency) + offer facts confirmed 2026-09-29.
version: 2
updated: "2026-09-29"

summary_extra:
  - "Closest analogue to Nowa is Finch: a pet you care for by doing real-life tasks. Its longest runners show the pet UI by second 3 to 5, turn a chore into a game, and keep one primary text across every variant while creators rotate the video."

label_meaning:
  hook_type: "Open with the good outcome or a question, not the fight. Problem-first hooks are what competitors retire."
  proof_type: "UGC wins pooled only because Finch is all UGC. Per brand, long-runners lean on the product in context."
  pain_point: "Independence and connection rise per brand: kids doing it themselves, and kids connecting."
  awareness_stage: "Durable ads speak to a parent who knows the situation, not the product."
  driver: "Family closeness outlasts convenience."
  funnel_stage: "Each brand's longest runners are top of funnel: built to be seen for months, not to close this week."
  offer_type: "Long-runners carry offers as bundles, not discounts. No competitor video leads with a price."
  cta_intent: "Download at 60+ days is Finch's app install. Physical products send Learn more to an occasion page."

templates:
  - id: A
    name: "Myth-bust kinetic text"
    seen_in: "Yoto 146 d, 88 d x2; Tin Can 103 d"
    beats: "0-1 s common belief, then the contrast line · 1-4 s product in the occasion · promise for kid and parent · breadth flash · end card. 12-20 s, works silent."
    hook_formula: "Most ___ get used once… / But not ___"
    nowa_note: "Competitors say 'screen-free'. Nowa has a display, so the contrast is 'a pet, not a screen to scroll'."
  - id: B
    name: "Funny inversion UGC"
    seen_in: "Tin Can 41 d; Yoto 88 d ('not to be dramatic but…')"
    beats: "0-4 s kid out-does parent · 3 how-it-works facts, parent control first · the turn · close on connection. 20-25 s."
    hook_formula: "My ___-year-old now ___ better than I do"
    nowa_note: "Real families only, describing real use. Pre-launch that means beta families; outcome lines are placeholders until a family says them."
  - id: C
    name: "Reveal & reaction"
    seen_in: "tonies Bluey 42 d (4 versions each)"
    beats: "Set up the surprise · kid reaction · features as the child's independence · nostalgia or connection close. 20-25 s."
    hook_formula: "I was so excited to surprise my ___ with ___"
    nowa_note: "The pet-world moment (egg, pixel HUD) is where Tiny5 and the pet's sounds belong on screen."
  - id: D
    name: "Game-ify the routine"
    seen_in: "Finch 130 d, 129 d, 116 d, 96 d"
    beats: "0-3 s self-deprecating reframe · pet UI by 3-5 s · one concrete routine as a checklist · outcome · objection answered · CTA. Primary text constant, video rotates. 15-25 s."
    hook_formula: "Turns out ___ wasn't ___. ___ just needed ___"
    nowa_note: "Flip Finch's 'a bird tells me what to do' into the child looking after the pet. Never obedience framing."
  - id: E
    name: "Qualify → quiz"
    seen_in: "Good Inside 42 d (listicle)"
    beats: "Title card '3 signs…' · 3 recognisable moments as text over footage · 'Take the quiz' → quiz page. 12-15 s."
    hook_formula: "3 signs your ___"
    nowa_note: "Nowa's quiz is its cheapest lead source (about $3.8 CPL). Overview ideas point to the homepage instead."

translation_rules:
  - "Nowa has a display. Never say 'screen-free'. Say 'a pet, not a screen to scroll', or show what's different: no feed, no autoplay, no open internet, an ending built in."
  - "The pet never speaks words. It chirps, sulks, celebrates and falls asleep. No voice-over in the pet's mouth."
  - "No 'AI' in copy and never 'no AI'. Anti-chatbot lines from the swipe file are fine ('It doesn't talk back. That's the whole point.')."
  - "'Built with' or 'shaped by' the advisors, never 'clinically proven'. Only cite stats exactly as on the site (Mindell et al., Sleep, 2009)."
  - "No obedience or control framing ('makes kids listen', 'runs our house'). Routines run on skills the child is building."
  - "No urgency and no live counts. Offer facts: $99 pre-order, fully refundable, ships October 2026, automatic refund if not shipped by November 30, 2026."
  - "UGC (templates B, C) must be real families describing real use (FTC endorsement rules). Until launch that means beta families; scripted outcomes are placeholders."
  - "Don't borrow competitors' lines or examples ('deeply feeling kid', Good Inside's sandwich, Finch's '245% happier'). Don't name Tamagotchi or competitors."
  - "Never 'no microphone'. If the mic comes up: push-to-talk with a hardware mute switch."
  - "No em-dashes in on-screen text or copy. 'Magical' needs a per-use sign-off."

ad_notes:
  "3979911272309601":
    title: "Most birthday gifts get used once…"
    copy: "Dynamic creative: copy comes from the catalog and the video does the work. Links to an occasion page (/lp/why-yoto/gifting)."
    steal: "A myth-bust hook on screen. One occasion per ad with its own landing page. One line that promises for kid and parent."
  "1683458632895596":
    title: "Make a long trip feel mini…"
    copy: "Dynamic creative, travel landing page. A near-identical cut ran just as long, so the concept was kept while the edit was tested."
    steal: "The parenthetical parent win '(and parents happy)'. One concrete product detail. Kid audio as the payoff, not the opener."
  "1336383434616692":
    title: "Make a long trip feel mini… (cut 2)"
    steal: "Same concept, second edit: evidence the brand iterates the cut instead of replacing the idea."
  "1641367974218400":
    title: "My 2-year-old might be the Beatles' biggest fan"
    steal: "'Not to be dramatic but…' overstatement as the hook; the product appears as the kid's 'best friend'."
  "1534471058116712":
    title: "Social independence without the screens"
    copy: "A 9 s text card: benefit, then a category reframe ('the new-school landline for friends')."
    steal: "Name a new category in one line. Nowa's version: 'a pocket-sized pet, not a screen to scroll'."
  "1725560258733941":
    title: "My 3-year-old has a better social life than I do"
    copy: "A 3-part joke list in the primary text (zero screens, zero spam calls, zero chance my toddler FaceTimes my boss)."
    steal: "The inversion hook. Parent control stated early. 'Not another screen' as the pivot. Ends on connection, not features."
  "1599123804948580":
    title: "Pencils down, now pick up!"
    steal: "A 3 s back-to-school pun card. Occasion + humour carries a tiny budget cut."
  "1848312609481516":
    title: "Surprising my toddler with Bluey Tonies"
    copy: "First-person creator post, #ad disclosed, then 'comment BLUEY and I'll send you the link'."
    steal: "Reveal, reaction, then features framed as the child's independence. Comment-keyword CTA (needs a DM tool)."
  "1413922280553201":
    title: "It feels like childhood again"
    steal: "The nostalgia close lands with parents: 'childhood again, instead of just more screen time'."
  "1746326456488858":
    title: "Bluey gets everyone off the couch"
    steal: "Family-connection close: the product as the thing that brings the family together."
  "2115089116091507":
    title: "Licensed character, 6 s"
    steal: "A character the kid already loves does the stopping. Nowa's equivalent is the pet itself."
  "1332218768994181":
    title: "Monopoly, reimagined"
    steal: "A 17 s demo: show the play, name the family moment ('Family game night starts now')."
  "1951860762159141":
    title: "Believe your ears: Bluey is on tonies"
    steal: "Launch news as the hook, one line of benefit, logo. Short and repeatable."
  "1372628207642777":
    title: "It's when you stop liking your kid"
    copy: "Headline as a quoted label ('Defiant' Kids); one-line body."
    steal: "A taboo truth said plainly by an expert, then validation, then a reframe."
    avoid: "Works because a named expert says it. Nowa: 'built with' advisors, and never Good Inside's phrases."
  "2567203997055739":
    title: "If you stay in your kid's bedroom…"
    steal: "Permission-giving opener ('there's no problem with that') before the offer."
    avoid: "Identity-level parent pain belongs in email and blog for Nowa, not cold ads."
  "1112477591105182":
    title: "3 signs… take this quiz"
    steal: "A text-only listicle into a qualifying quiz. Cheap to make, easy to version."
    avoid: "Don't reuse their examples or the 'deeply feeling kid' label."
  "1488801682793327":
    title: "Turns out I wasn't lazy…"
    copy: "One primary text across every variant: 'OF COURSE I needed to take care of a pet to take care of myself'. The video is the variable."
    steal: "Self-deprecating reframe, pet UI by second 3 to 5, one routine as a checklist."
    avoid: "Invented stats, mental-health claims, and 'a bird that tells me what to do' (obedience framing for kids)."
  "1889602741749444":
    title: "5 things to clean every week"
    steal: "A useful checklist is the spine; the pet is the reason to do it."
    avoid: "'245% happier' and the depression framing."
  "1994543121156248":
    title: "Them: 'it's impossible…' / Me since…"
    steal: "The 'Them vs Me' text hook sets up a proof-by-doing."
  "27630412696592868":
    title: "Habits that made me unrecognizable"
    steal: "A numbered habit list over the pet UI, no voice needed."
  "1685644489138574":
    title: "20 squats so my bird gets rainbow stones"
    steal: "The reward loop explained in one sentence by a creator mid-task."
  "2106746903590706":
    title: "Me vs My Brain skit"
    steal: "Two-voice skits make the reframe funny instead of preachy."
  "2127656931112516":
    title: "Younger me vs older me"
    steal: "Before/after as a conversation, not a claim."
    avoid: "The mental-health recovery claim."

  "1347078480809744":
    title: "Looking for a gift they'll use every day?"
    copy: "Dynamic creative. A second Yoto video at 146 days, also gifting."
    steal: "A question hook that names the buyer's real worry (will they use it?), then the category line and 'the kind of gift they won't put down'."
  "1565623128480207":
    title: "Still their favorite gift. Years later."
    copy: "Dynamic creative; text-only story in four cards."
    steal: "Answers the 'played with once' objection with time: 'They didn't know it existed… still their favorite gift. Years later.'"
    avoid: "Nowa hasn't shipped, so 'years later' is a claim we can't make yet. Use it after launch with real families."
  "961201880024377":
    title: "Imagine what you can look like in July…"
    steal: "Future-self framing: small daily reps compound. Nowa's version is about a skill, not a body."
    avoid: "Body-image framing. Never for kids."
  "1036081149232494":
    title: "Couldn't be just anyone! RING! RING!"
    steal: "A 3 s card with one sound and one line. Cheap to make; a good cutdown format for any Nowa idea (the pet's chirp as the ring)."
  "1054895460468456":
    title: "Do you have a deeply feeling kid? Take the quiz"
    copy: "Question hook straight into a quiz, voiced by the expert."
    steal: "The qualify-then-quiz spine (template E)."
    avoid: "Good Inside's 'deeply feeling kid' label is theirs and a Nowa brand rule forbids it. Echo the idea in our own words ('feels everything at ten times the size')."

ideas_intro: "5 templates x 4 segments x 3 ideas. Each is a 9:16 master of 12 to 25 s with a hook written on screen at 0 s, built to work muted. Hold the primary text constant within an idea so the test is the video. Segment ideas link to their segment page; overview ideas link to the homepage only; template E links to that segment's quiz."

segments:
  routine:
    label: "Routine"
    lp: "/for/routine"
    angle: "Less nagging. More follow-through. Mirror the ninth time asking; the win is the child doing it without the parent narrating."
  big_feelings:
    label: "Big feelings"
    lp: "/for/big-feelings"
    angle: "Calm is a rep, not a trait. Practice happens in calm moments, before the storm, never during it."
  screen_anxious:
    label: "Screen-anxious"
    lp: "/for/screen-anxious"
    angle: "It has a screen, and it has an ending. No feed, no autoplay, no open internet; the pet gets sleepy and play stops."
  overview:
    label: "Product overview"
    lp: "/"
    angle: "What Nowa is: a pocket-sized pet your child looks after through real-world missions. Links to the homepage only."

ideas:
  # ---------------- ROUTINE ----------------
  - {id: R-A1, segment: routine, template: A, title: "Most chore charts last a week",
     hook: "Most chore charts last a week… / This one needs breakfast.",
     beats: [["0-1 s", "A sticker chart peeling off the fridge."], ["1-4 s", "Kid presses a chunky button; the pet on the display wants breakfast."], ["4-9 s", "Kid eats, brushes teeth; the pet perks up with a chirp."], ["9-13 s", "Super: 'You choose the routine. Nowa turns it into a mission.'"], ["13-15 s", "End card: Less reminding. More getting ready."]],
     primary_text: "The routine lives in your head, so you're the one running it. Nowa hands it to someone your kid wants to help."}
  - {id: R-A2, segment: routine, template: A, title: "Said 'shoes' nine times?",
     hook: "Said 'shoes' nine times this morning? / Try zero.",
     beats: [["0-2 s", "Kinetic count 1 to 9 over the front door."], ["2-6 s", "Kid picks up Nowa: the mission is 'get dressed'."], ["6-10 s", "Shoes on, the pet celebrates."], ["10-14 s", "Super: Less nagging. More follow-through."]],
     primary_text: "The ninth 'shoes on' doesn't have to be yours."}
  - {id: R-A3, segment: routine, template: A, title: "Timers ring. Pets wait.",
     hook: "Bedtime timers get ignored… / A sleepy pet doesn't.",
     beats: [["0-2 s", "A kitchen timer rings in an empty room."], ["2-6 s", "The pet yawns on the display, waiting to be tucked in."], ["6-11 s", "Pajamas, teeth, the kid tucks the pet in; it falls asleep."], ["11-15 s", "Super: 'Bedtime has an ending built in.'"]],
