[project]
name = "ad-teardown"
version = "0.1.0"
description = "Ad teardown research pipeline (own Meta ads + competitor Ad Library) — standalone, not part of the dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.31,<3",
    "pyyaml>=6,<7",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
media = [
    "pillow>=10",
    "imagehash>=4.3",
    "faster-whisper>=1.0",
]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
